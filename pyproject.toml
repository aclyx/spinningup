[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spinup"
version = "0.2.0"
description = "Teaching tools for introducing people to deep reinforcement learning."
readme = "readme.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joshua Achiam" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "cloudpickle>=3.0",
    "gymnasium[classic-control]>=1.0,<2",
    "ipython>=8.20",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "mpi4py>=4.0",
    "numpy>=1.26,<3",
    "pandas>=2.1",
    "psutil>=5.9",
    "scipy>=1.11",
    "seaborn>=0.13",
    "tensorflow>=2.16,<2.21",
    "tf-keras>=2.16,<2.21",
    "torch>=2.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
atari = ["gymnasium[atari]>=1.0,<2"]
box2d = ["gymnasium[box2d]>=1.0,<2"]
docs = [
    "sphinx>=7,<8",
    "sphinx-autobuild>=2024.10",
    "sphinx-rtd-theme>=2,<4",
]
mujoco = ["gymnasium[mujoco]>=1.0,<2"]

[project.urls]
Documentation = "https://spinningup.openai.com"
Repository = "https://github.com/openai/spinningup"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["spinup*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["test"]
